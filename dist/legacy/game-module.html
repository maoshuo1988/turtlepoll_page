<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>龟龟跳海</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #06111a;
    }
    .host-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #06111a;
    }
  </style>
</head>
<body>
  <iframe id="gameFrame" class="host-frame" src="/legacy/game.html"></iframe>

  <script>
    const frame = document.getElementById('gameFrame');

    frame.addEventListener('load', () => {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;

        const back = doc.querySelector('.nav-back');
        if (back) {
          back.setAttribute('href', 'javascript:void(0)');
          back.addEventListener('click', (e) => {
            e.preventDefault();
            window.parent.postMessage({ type: 'turtle_go_home' }, window.location.origin);
          });
        }
      } catch (_) {
        // same-origin expected
      }
    });
  </script>
</body>
</html>
